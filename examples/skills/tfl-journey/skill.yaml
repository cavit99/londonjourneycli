name: tfl-journey
description: Plan London journeys and check live TfL arrivals through LondonJourneyCLI.
ownerDomain: london-transport
triggers:
  - how do I get to
  - journey from
  - next bus
  - tfl
safetyLevel: read-only
cronSafe: true
requires:
  bins:
    - londonjourneycli
commands:
  - name: status
    description: Check live TfL line status.
    exec: [londonjourneycli, tfl, status]
  - name: disruptions
    description: Check active TfL disruptions.
    exec: [londonjourneycli, tfl, disruptions]
  - name: line-routes
    description: Inspect TfL line route sections and directions.
    exec: [londonjourneycli, tfl, line-routes]
  - name: nearby-stops
    description: Find TfL stops near coordinates.
    exec: [londonjourneycli, tfl, nearby-stops]
  - name: journey
    description: Plan a journey with TfL.
    exec: [londonjourneycli, tfl, journey]
  - name: arrivals
    description: Check live arrivals at a stop.
    exec: [londonjourneycli, tfl, arrivals]
  - name: next-arrival
    description: Resolve a stop query and return the next matching live arrival.
    exec: [londonjourneycli, tfl, next-arrival]
  - name: stop-info
    description: Inspect a stop point and its child stops.
    exec: [londonjourneycli, tfl, stop-info]
  - name: watch-arrival
    description: Perform a one-shot live arrival check with optional visible delivery.
    exec: [londonjourneycli, tfl, watch-arrival]
tests:
  - name: stop-search-smoke
    command: [londonjourneycli, --json, tfl, stop-search, London Bridge, --mode, "tube,bus", --limit, "1"]
verification:
  - Run go test ./...
  - Run LONDONJOURNEYCLI_LIVE_TFL=1 go test ./internal/tfl -run Live -count=1 -v before releasing TfL changes.
